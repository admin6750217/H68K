#
# LEDE Rockchip ARM64 Cloud Build
#
# Source:
# https://github.com/coolsnowwolf/lede
#
# Based on:
# https://github.com/P3TERX/Actions-OpenWrt
#

name: rockchip

permissions: write-all

on:
  repository_dispatch:

  workflow_dispatch:
    inputs:
      build_mode:
        description: "编译模式"
        required: true
        default: "正常编译"
        type: choice
        options:
          - 正常编译
          - 仅编译机器 config.buildinfo

  schedule:
    # 每周三北京时间 20:00
    # GitHub Actions 使用 UTC
    - cron: "0 12 * * 3"

env:
  # ==========================================================
  # 基础设置
  # ==========================================================
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  # LEDE 源码
  # ==========================================================
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  # ==========================================================
  # 编译配置
  # ==========================================================
  PLATFORM_FILE: configs/Target-rockchip-L.txt
  CONFIG_FILE: configs/Packages.txt
  MACHINE_CONFIG_FILE: configs/config.buildinfo

  # ==========================================================
  # 自定义脚本
  # ==========================================================
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

  # ==========================================================
  # 上传设置
  # ==========================================================
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false

jobs:
  build:
    name: LEDE Rockchip ARM64 H68K
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 检查代码
      # ======================================================
      - name: 检查代码
        uses: actions/checkout@v4

      # ======================================================
      # 2. 初始化环境
      # ======================================================
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "初始化编译环境"
          echo "=========================================="

          chmod +x "$FREE_DISK_SH"
          chmod +x "$ENV_SH"
          chmod +x "$DIY_P1_SH"
          chmod +x "$DIY_P2_SH"

          "$FREE_DISK_SH"
          "$ENV_SH"

          sudo rm -rf /etc/apt/sources.list.d/*
          sudo rm -rf /var/lib/apt/lists/*

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

          echo "BUILD_DATE=$(date '+%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

          echo
          echo "当前时间："
          date

          echo
          echo "编译模式：${{ github.event.inputs.build_mode || '正常编译' }}"

      # ======================================================
      # 3. 检查磁盘空间
      # ======================================================
      - name: 检查空间使用情况
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 4. 克隆 LEDE
      # ======================================================
      - name: 克隆源码
        working-directory: /workdir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "克隆 LEDE 源码"
          echo "=========================================="

          git clone \
            "$REPO_URL" \
            --depth 1 \
            --single-branch \
            -b "$REPO_BRANCH" \
            openwrt

          ln -sf \
            /workdir/openwrt \
            "$GITHUB_WORKSPACE/openwrt"

          cd /workdir/openwrt

          WRT_HASH=$(git log -1 --pretty=format:'%h')

          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo
          echo "源码：$REPO_URL"
          echo "分支：$REPO_BRANCH"
          echo "Commit：$WRT_HASH"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE" || true
          fi

      # ======================================================
      # 5. DIY Part 1
      # ======================================================
      - name: 执行 DIY Part 1
        shell: bash
        run: |
          set -e

          chmod +x "$DIY_P1_SH"
          "$DIY_P1_SH"

      # ======================================================
      # 6. CCACHE
      # ======================================================
      - name: 检查缓存
        id: check-cache
        uses: actions/cache@v4
        with:
          key: rockchip-${{ env.REPO_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            rockchip-${{ env.REPO_BRANCH }}-
          path: |
            ./openwrt/.ccache
            ./openwrt/staging_dir/host*
            ./openwrt/staging_dir/tool*

      # ======================================================
      # 7. 开启 CCACHE
      # ======================================================
      - name: 开启 CCACHE 配置
        shell: bash
        run: |
          set -e

          echo "CONFIG_DEVEL=y" >> openwrt/.config
          echo "CONFIG_CCACHE=y" >> openwrt/.config

      # ======================================================
      # 8. 更新缓存
      # ======================================================
      - name: 更新缓存
        shell: bash
        run: |
          set -e

          if [ -d "./openwrt/staging_dir" ]; then

            find "./openwrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" |
            while read -r DIR; do
              find "$DIR" \
                -type f \
                -exec touch {} +
            done

            mkdir -p ./openwrt/tmp
            echo "1" > ./openwrt/tmp/.build

            echo "缓存环境恢复完成"

          else

            echo "没有发现 staging_dir"

          fi

      # ======================================================
      # 9. 更新 feeds
      # ======================================================
      - name: 更新 feeds
        shell: bash
        run: |
          set -e

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ======================================================
      # 10. 导入配置
      # ======================================================
      - name: 导入编译配置
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          BUILD_MODE="${{ github.event.inputs.build_mode || '正常编译' }}"

          echo "=========================================="
          echo "当前编译模式：$BUILD_MODE"
          echo "=========================================="

          # ==================================================
          # 正常编译
          # ==================================================
          if [ "$BUILD_MODE" = "正常编译" ]; then

            echo
            echo "========== 正常编译 =========="

            if [ ! -f "$PLATFORM_FILE" ]; then
              echo "❌ 找不到：$PLATFORM_FILE"
              exit 1
            fi

            if [ ! -f "$CONFIG_FILE" ]; then
              echo "❌ 找不到：$CONFIG_FILE"
              exit 1
            fi

            echo
            echo "========== Target =========="

            cat "$PLATFORM_FILE"

            cat "$PLATFORM_FILE" >> openwrt/.config

            echo
            echo "========== Packages =========="

            cat "$CONFIG_FILE"

            cat "$CONFIG_FILE" >> openwrt/.config

          # ==================================================
          # 仅编译机器 config.buildinfo
          # ==================================================
          elif [ "$BUILD_MODE" = "仅编译机器 config.buildinfo" ]; then

            echo
            echo "=========================================="
            echo "仅编译机器 config.buildinfo"
            echo "=========================================="

            if [ ! -f "$MACHINE_CONFIG_FILE" ]; then
              echo
              echo "❌ 找不到机器配置："
              echo "$MACHINE_CONFIG_FILE"
              exit 1
            fi

            echo
            echo "========== 机器 config.buildinfo =========="

            cat "$MACHINE_CONFIG_FILE"

            echo
            echo "导入机器配置..."

            cat "$MACHINE_CONFIG_FILE" >> openwrt/.config

          else

            echo "❌ 未知编译模式：$BUILD_MODE"
            exit 1

          fi

          # ==================================================
          # 强制仅编译 H68K
          # ==================================================
          echo
          echo "=========================================="
          echo "锁定设备：Hinlink OPC-H68K"
          echo "=========================================="

          {
            echo "CONFIG_TARGET_rockchip=y"
            echo "CONFIG_TARGET_rockchip_armv8=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h68k=y"
          } >> openwrt/.config

          # ==================================================
          # 自定义 files
          # ==================================================
          if [ -d "$GITHUB_WORKSPACE/files" ]; then

            echo
            echo "复制自定义 files"

            rm -rf openwrt/files
            cp -rf "$GITHUB_WORKSPACE/files" openwrt/files

          fi

          # ==================================================
          # DIY Part 2
          # ==================================================
          echo
          echo "=========================================="
          echo "执行 DIY Part 2"
          echo "=========================================="

          chmod +x "$DIY_P2_SH"
          "$DIY_P2_SH"

      # ======================================================
      # 11. 检查配置
      # ======================================================
      - name: 检查编译配置
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "Target 配置"
          echo "=========================================="

          grep '^CONFIG_TARGET' .config || true

          echo
          echo "=========================================="
          echo "设备配置"
          echo "=========================================="

          grep '^CONFIG_TARGET_DEVICE_' .config || true

          echo
          echo "=========================================="
          echo "Packages"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_' .config | head -100 || true

      # ======================================================
      # 12. 下载文件
      # ======================================================
      - name: 下载文件
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "生成最终配置"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "最终设备"
          echo "=========================================="

          grep '^CONFIG_TARGET_DEVICE_' .config || true

          echo
          echo "=========================================="
          echo "下载源码包"
          echo "=========================================="

          make download -j8 V=s

          find dl \
            -type f \
            -size -1024c \
            -exec ls -l {} \;

          find dl \
            -type f \
            -size -1024c \
            -exec rm -f {} \;

      # ======================================================
      # 13. 编译前空间
      # ======================================================
      - name: 编译前空间检查
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 14. 编译固件
      # ======================================================
      - name: 编译固件
        id: compile
        shell: bash
        run: |
          set -e

          cd openwrt

          make defconfig

          echo
          echo "=========================================="
          echo "最终确认设备"
          echo "=========================================="

          grep '^CONFIG_TARGET_DEVICE_' .config || true

          echo
          echo "=========================================="
          echo "开始编译 LEDE"
          echo "=========================================="

          THREADS="$(nproc)"

          echo "CPU 线程：$THREADS"
          echo "LEDE Commit：$WRT_HASH"

          if ! make -j$((THREADS + 1)); then

            echo
            echo "=========================================="
            echo "多线程编译失败"
            echo "开始单线程详细编译"
            echo "=========================================="

            make -j1 V=s

          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 15. 编译后空间
      # ======================================================
      - name: 编译后空间检查
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 16. 整理固件
      # ======================================================
      - name: 整理文件
        id: organize
        if: >
          steps.compile.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          cd openwrt/bin/targets/*/*

          echo "=========================================="
          echo "整理固件"
          echo "=========================================="

          # 删除无用文件
          rm -rf *.bin
          rm -rf *.json
          rm -rf *.manifest

          # 注意：
          # 不删除 *.buildinfo
          # 必须保留 config.buildinfo

          # 删除 packages
          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          echo "========== 固件目录 =========="

          ls -lah

      # ======================================================
      # 17. 固件重命名
      # ======================================================
      - name: 固件重命名
        if: >
          steps.organize.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          cd "$FIRMWARE"

          shopt -s nullglob

          for file in *rockchip-armv8-*.gz; do

            new_name="${file#rockchip-armv8-}"

            if [ "$file" != "$new_name" ]; then
              echo "重命名：$file -> $new_name"
              mv -v "$file" "$new_name"
            fi

          done

          echo
          echo "========== 最终固件 =========="

          ls -lah

      # ======================================================
      # 18. 生成机器配置
      # ======================================================
      - name: 生成机器配置
        id: config
        if: >
          steps.organize.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/openwrt"

          echo "=========================================="
          echo "检查 config.buildinfo"
          echo "=========================================="

          if [ ! -f "$FIRMWARE/config.buildinfo" ]; then

            echo "❌ 未找到 config.buildinfo"

            echo
            echo "搜索："

            find "$GITHUB_WORKSPACE/openwrt/bin/targets" \
              -name "config.buildinfo" \
              -type f \
              -print || true

            exit 1

          fi

          echo
          echo "✅ 找到 config.buildinfo"

          # ==================================================
          # 生成仅机器配置
          # ==================================================
          MACHINE_OUTPUT="$FIRMWARE/machine.config.buildinfo"

          echo
          echo "=========================================="
          echo "生成 machine.config.buildinfo"
          echo "=========================================="

          {
            echo "# =================================================="
            echo "# LEDE Rockchip ARM64"
            echo "# Machine Configuration"
            echo "# Device: Hinlink OPC-H68K"
            echo "# Generated: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "# =================================================="
            echo

            echo "# Target"
            grep '^CONFIG_TARGET_rockchip=' .config || true
            grep '^CONFIG_TARGET_rockchip_armv8=' .config || true
            grep '^CONFIG_TARGET_MULTI_PROFILE=' .config || true

            echo
            echo "# Device"
            grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_' .config || true

            echo
            echo "# RootFS"
            grep '^CONFIG_TARGET_ROOTFS_' .config || true

            echo
            echo "# Kernel"
            grep '^CONFIG_TARGET_KERNEL_' .config || true

            echo
            echo "# Images"
            grep '^CONFIG_TARGET_IMAGES_' .config || true

            echo
            echo "# CPU Frequency"
            grep '^CONFIG_PACKAGE_luci-app-cpufreq=' .config || true

          } > "$MACHINE_OUTPUT"

          # ==================================================
          # 保存完整最终 .config
          # ==================================================
          cp .config "$FIRMWARE/full.config.buildinfo"

          echo
          echo "=========================================="
          echo "配置文件"
          echo "=========================================="

          ls -lh "$FIRMWARE"/*.buildinfo

          echo "status=success" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 19. 生成 Release
      # ======================================================
      - name: 生成发布标签
        id: tag
        if: >
          steps.compile.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          BUILD_MODE="${{ github.event.inputs.build_mode || '正常编译' }}"

          echo "🎉 LEDE Rockchip ARM64" > release.txt
          echo "🍃 Rockchip ARM64" >> release.txt
          echo "📦 设备：Hinlink OPC-H68K" >> release.txt
          echo "🧩 编译模式：$BUILD_MODE" >> release.txt
          echo "🌿 分支：$REPO_BRANCH" >> release.txt
          echo "🔖 Commit：$WRT_HASH" >> release.txt
          echo "🕒 编译时间：$BUILD_DATE" >> release.txt
          echo "❗️ 默认 IP：192.168.8.1" >> release.txt
          echo "" >> release.txt
          echo "config.buildinfo：本次实际编译配置" >> release.txt
          echo "machine.config.buildinfo：H68K 机器配置" >> release.txt
          echo "full.config.buildinfo：完整最终 .config" >> release.txt

          RELEASE_TAG="$(date '+%Y.%m.%d_Rockchip-H68K')"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          echo "Release Tag：$RELEASE_TAG"

      # ======================================================
      # 20. 上传 GitHub Release
      # ======================================================
      - name: 上传固件到发布
        uses: softprops/action-gh-release@v2
        if: >
          steps.tag.outputs.status == 'success'
          && steps.config.outputs.status == 'success'
          && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: LEDE Rockchip H68K ${{ env.BUILD_DATE }}
          body_path: release.txt

          files: |
            ${{ env.FIRMWARE }}/*.gz
            ${{ env.FIRMWARE }}/config.buildinfo
            ${{ env.FIRMWARE }}/machine.config.buildinfo
            ${{ env.FIRMWARE }}/full.config.buildinfo

          overwrite_files: true
