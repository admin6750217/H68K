#
# LEDE Rockchip Cloud Build
#
# Source:
# https://github.com/coolsnowwolf/lede
#
# Based on P3TERX/Actions-OpenWrt
#

name: LEDE Rockchip

permissions: write-all

on:
  repository_dispatch:

  workflow_dispatch:

  schedule:
    # 每周三北京时间 20:00
    # UTC+8 -> UTC 12:00
    - cron: "0 12 * * 3"

env:
  # ==========================================================
  # 时区
  # ==========================================================

  TZ: Asia/Shanghai

  # ==========================================================
  # LEDE 源码
  # ==========================================================

  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  # ==========================================================
  # 编译配置
  # ==========================================================

  PLATFORM_FILE: configs/Target-rockchip-L.txt
  CONFIG_FILE: configs/Packages.txt

  # ==========================================================
  # 自定义脚本
  # ==========================================================

  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

  # ==========================================================
  # 上传设置
  # ==========================================================

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true

jobs:
  build:
    name: LEDE Rockchip ARM64
    runs-on: ubuntu-24.04

    steps:
      # ======================================================
      # 1. 检出配置仓库
      # ======================================================

      - name: 检查代码
        uses: actions/checkout@v4

      # ======================================================
      # 2. 初始化环境
      # ======================================================

      - name: 初始化编译环境
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "=========================================="
          echo "初始化编译环境"
          echo "=========================================="

          chmod +x "$FREE_DISK_SH" || true
          chmod +x "$ENV_SH" || true
          chmod +x "$DIY_P1_SH" || true
          chmod +x "$DIY_P2_SH" || true

          # 清理空间
          if [ -f "$FREE_DISK_SH" ]; then
            "$FREE_DISK_SH"
          fi

          # 安装依赖
          if [ -f "$ENV_SH" ]; then
            "$ENV_SH"
          fi

          # 设置时区
          sudo timedatectl set-timezone "$TZ"

          # 工作目录
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

          # 编译时间
          echo "BUILD_DATE=$(date '+%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

          echo
          echo "当前时间："
          date

      # ======================================================
      # 3. 查看磁盘
      # ======================================================

      - name: 编译前空间
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 4. 克隆 LEDE
      # ======================================================

      - name: 克隆 LEDE 源码
        working-directory: /workdir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "克隆 LEDE 源码"
          echo "=========================================="

          git clone \
            --depth 1 \
            --single-branch \
            -b "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          # 建立软链接
          ln -sf \
            /workdir/openwrt \
            "$GITHUB_WORKSPACE/openwrt"

          cd /workdir/openwrt

          # 获取 Commit
          WRT_HASH=$(git rev-parse --short HEAD)

          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo
          echo "源码：$REPO_URL"
          echo "分支：$REPO_BRANCH"
          echo "Commit：$WRT_HASH"

          # ==================================================
          # 删除部分国内镜像
          # ==================================================

          PROJECT_MIRRORS_FILE="scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE" || true
          fi

      # ======================================================
      # 5. DIY Part 1
      # ======================================================

      - name: 执行 DIY Part 1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "执行 DIY Part 1"
          echo "=========================================="

          chmod +x "$DIY_P1_SH"
          "$DIY_P1_SH"

      # ======================================================
      # 6. CCACHE
      # ======================================================

      - name: 恢复编译缓存
        id: check-cache
        uses: actions/cache@v4
        with:
          key: lede-rockchip-${{ env.REPO_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            lede-rockchip-${{ env.REPO_BRANCH }}-
            lede-rockchip-
          path: |
            openwrt/.ccache
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*

      # ======================================================
      # 7. 开启 CCACHE
      # ======================================================

      - name: 开启 CCACHE
        shell: bash
        run: |
          set -e

          echo "CONFIG_DEVEL=y" >> openwrt/.config
          echo "CONFIG_CCACHE=y" >> openwrt/.config

      # ======================================================
      # 8. 恢复缓存环境
      # ======================================================

      - name: 修复缓存环境
        shell: bash
        run: |
          set -e

          if [ -d "openwrt/staging_dir" ]; then
            echo "发现 staging_dir"

            find openwrt/staging_dir \
              -type d \
              -name stamp \
              -not -path "*target*" \
              -print0 |
            while IFS= read -r -d '' DIR; do
              find "$DIR" \
                -type f \
                -exec touch {} +
            done

            mkdir -p openwrt/tmp

            echo "1" > openwrt/tmp/.build

            echo "缓存恢复完成"
          else
            echo "没有发现 staging_dir"
          fi

      # ======================================================
      # 9. 更新 feeds
      # ======================================================

      - name: 更新 feeds
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "更新 feeds"
          echo "=========================================="

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ======================================================
      # 10. DIY Part 2
      # ======================================================

      - name: 执行 DIY Part 2
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "执行 DIY Part 2"
          echo "=========================================="

          chmod +x "$DIY_P2_SH"
          "$DIY_P2_SH"

      # ======================================================
      # 11. 检查配置文件
      # ======================================================

      - name: 检查编译配置
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "检查配置"
          echo "=========================================="

          test -f "$PLATFORM_FILE"
          test -f "$CONFIG_FILE"

          echo
          echo "Target 配置："
          cat "$PLATFORM_FILE"

          echo
          echo "Packages 配置："
          cat "$CONFIG_FILE"

      # ======================================================
      # 12. 生成最终 .config
      # ======================================================

      - name: 生成最终配置
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "make defconfig"
          echo "=========================================="

          make defconfig

          echo
          echo "========== Target =========="

          grep '^CONFIG_TARGET' .config || true

          echo
          echo "========== Packages =========="

          grep '^CONFIG_PACKAGE_' .config \
            | head -100 || true

      # ======================================================
      # 13. 下载源码包
      # ======================================================

      - name: 下载编译依赖
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "下载源码包"
          echo "=========================================="

          make download -j8 V=s

          echo
          echo "检查异常文件"

          find dl \
            -type f \
            -size -1024c \
            -print

          find dl \
            -type f \
            -size -1024c \
            -delete

      # ======================================================
      # 14. 编译前空间
      # ======================================================

      - name: 编译前空间检查
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 15. 开始编译
      # ======================================================

      - name: 编译固件
        id: compile
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "开始编译 LEDE"
          echo "=========================================="

          make defconfig

          THREADS="$(nproc)"

          echo
          echo "CPU 线程：$THREADS"
          echo "LEDE Commit：$WRT_HASH"
          echo

          # ==================================================
          # 第一次：多线程编译
          # ==================================================

          if ! make -j$((THREADS + 1)); then
            echo
            echo "=========================================="
            echo "多线程编译失败"
            echo "开始单线程详细编译"
            echo "=========================================="
            echo

            make -j1 V=s
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 16. 编译后空间
      # ======================================================

      - name: 编译后空间检查
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 17. 上传完整 bin
      # ======================================================

      - name: 上传 bin 目录
        if: >
          steps.compile.outputs.status == 'success'
          && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LEDE_bin_${{ env.BUILD_DATE }}
          path: openwrt/bin

      # ======================================================
      # 18. 整理固件
      # ======================================================

      - name: 整理固件
        id: organize
        if: >
          steps.compile.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          cd openwrt/bin/targets/*/*

          echo "=========================================="
          echo "整理固件"
          echo "=========================================="

          # 删除 packages
          rm -rf packages

          # 删除无用文件
          rm -f *.bin
          rm -f *.buildinfo
          rm -f *.json
          rm -f *.manifest

          # 保存固件路径
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          echo "========== 固件列表 =========="

          ls -lah

      # ======================================================
      # 19. Rockchip 固件重命名
      # ======================================================

      - name: 固件重命名
        if: steps.organize.outputs.status == 'success'
        shell: bash
        run: |
          set -e

          cd "$FIRMWARE"

          shopt -s nullglob

          for file in *rockchip-armv8-*.gz; do
            new_name="${file#rockchip-armv8-}"

            if [ "$file" != "$new_name" ]; then
              echo "$file"
              echo " -> "
              echo "$new_name"

              mv -v "$file" "$new_name"
            fi
          done

      # ======================================================
      # 20. 上传 Artifact
      # ======================================================

      - name: 上传固件
        if: >
          env.UPLOAD_FIRMWARE == 'true'
          && steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LEDE_Rockchip_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}

      # ======================================================
      # 21. 生成 Release
      # ======================================================

      - name: 生成 Release
        id: tag
        if: >
          steps.compile.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          RELEASE_TAG="LEDE-${WRT_HASH}-$(date '+%Y%m%d-%H%M')"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"

          cat > release.txt << EOF
# LEDE Rockchip ARM64

## 编译信息

📦 源码：
https://github.com/coolsnowwolf/lede

🌿 分支：
${REPO_BRANCH}

🔖 Commit：
${WRT_HASH}

🕐 编译时间：
$(date '+%Y-%m-%d %H:%M:%S')

## 编译配置

🎯 Target：
configs/Target-rockchip-L.txt

📦 Packages：
configs/Packages.txt

## 默认设置

🌐 默认 IP：
192.168.8.1

⚠️ 固件仅供测试和学习使用。
EOF

          echo
          cat release.txt

      # ======================================================
      # 22. 发布 GitHub Release
      # ======================================================

      - name: 发布固件
        if: >
          steps.tag.outputs.status == 'success'
          && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: LEDE Rockchip ${{ env.BUILD_DATE }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*
          overwrite_files: true
