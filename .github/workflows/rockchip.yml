# LEDE Rockchip ARM64 / Hinlink OPC-H68K
name: rockchip

# 创建 Release 权限
permissions:
  contents: write

# H68K 编译任务不并行
concurrency:
  group: rockchip-h68k
  cancel-in-progress: false

on:
  # 手动编译
  workflow_dispatch:
    inputs:
      build_mode:
        description: 选择编译模式
        required: true
        default: 正常编译
        type: choice
        options:
          - 正常编译
          - 仅编译机器 config.buildinfo

  # API 触发
  repository_dispatch:

  # 每天北京时间 02:00 自动编译
  schedule:
    - cron: "0 18 * * *"

# 全局变量
env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  # 配置文件
  PLATFORM_FILE: configs/Target-rockchip-L.txt
  PACKAGE_FILE: configs/Packages.txt
  MACHINE_CONFIG_FILE: configs/config.buildinfo

  # 脚本
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

jobs:
  build:
    name: LEDE Rockchip ARM64 H68K
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # 获取配置仓库
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 确定编译模式
      - name: Set build mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_MODE=${{ github.event.inputs.build_mode }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_MODE=正常编译" >> "$GITHUB_ENV"
          fi

      # 初始化环境并清空工作目录
      - name: Prepare environment
        run: |
          set -e
          sudo mkdir -p /workdir
          sudo chown -R "$(id -u):$(id -g)" /workdir

          chmod +x "$GITHUB_WORKSPACE/$FREE_DISK_SH" \
                   "$GITHUB_WORKSPACE/$ENV_SH"

          bash "$GITHUB_WORKSPACE/$FREE_DISK_SH"
          bash "$GITHUB_WORKSPACE/$ENV_SH"

          # 清理 /workdir，不删除 Actions Cache
          find /workdir -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          rm -rf "$GITHUB_WORKSPACE/openwrt" \
                 "$GITHUB_WORKSPACE/bin" \
                 "$GITHUB_WORKSPACE/tmp" \
                 "$GITHUB_WORKSPACE/logs"

          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      # 下载 LEDE
      - name: Clone LEDE
        run: |
          set -e
          cd /workdir

          git clone "$REPO_URL" \
            --depth 1 \
            --single-branch \
            -b "$REPO_BRANCH" \
            openwrt

          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

          cd openwrt
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> "$GITHUB_ENV"

      # DIY1：独立执行
      - name: DIY Part 1
        working-directory: /workdir/openwrt
        run: |
          set -e
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # 恢复编译缓存
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/tool*
          key: rockchip-${{ env.REPO_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            rockchip-${{ env.REPO_BRANCH }}-

      # 开启 CCACHE
      - name: Enable ccache
        working-directory: /workdir/openwrt
        run: |
          sed -i '/^CONFIG_DEVEL=/d;/^CONFIG_CCACHE=/d' \
            .config 2>/dev/null || true

          cat >> .config <<'EOF'
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF

      # 更新 / 安装 feeds
      - name: Update feeds
        working-directory: /workdir/openwrt
        run: ./scripts/feeds update -a

      - name: Install feeds
        working-directory: /workdir/openwrt
        run: ./scripts/feeds install -a

      # 导入配置
      - name: Import config
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ "$BUILD_MODE" = "仅编译机器 config.buildinfo" ]; then
            # 机器模式：只使用机器配置
            test -f "$GITHUB_WORKSPACE/$MACHINE_CONFIG_FILE"
            cat "$GITHUB_WORKSPACE/$MACHINE_CONFIG_FILE" >> .config
          else
            # 正常模式：平台 + 软件包配置
            test -f "$GITHUB_WORKSPACE/$PLATFORM_FILE"
            test -f "$GITHUB_WORKSPACE/$PACKAGE_FILE"

            cat "$GITHUB_WORKSPACE/$PLATFORM_FILE" >> .config
            cat "$GITHUB_WORKSPACE/$PACKAGE_FILE" >> .config
          fi

      # 应用自定义 files/
      - name: Apply files
        working-directory: /workdir/openwrt
        run: |
          [ ! -d "$GITHUB_WORKSPACE/files" ] || \
          cp -a "$GITHUB_WORKSPACE/files/." .

      # DIY2：独立执行
      - name: DIY Part 2
        working-directory: /workdir/openwrt
        run: |
          set -e
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      # 强制锁定 H68K
      - name: Lock H68K
        working-directory: /workdir/openwrt
        run: |
          set -e

          # 删除其他 Rockchip ARM64 设备
          sed -i '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_/d' .config

          # 删除原 Target 配置
          sed -i '/^CONFIG_TARGET_rockchip=/d;
                  /^CONFIG_TARGET_rockchip_armv8=/d;
                  /^CONFIG_TARGET_MULTI_PROFILE=/d' .config

          # 只保留 Hinlink OPC-H68K
          cat >> .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h68k=y
          EOF

      # 生成最终配置并验证唯一设备
      - name: Make defconfig
        working-directory: /workdir/openwrt
        run: |
          set -e
          make defconfig

          COUNT=$(grep \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
            .config | wc -l)

          [ "$COUNT" -eq 1 ]

          grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h68k=y$' \
            .config

      # 下载源码
      - name: Download
        working-directory: /workdir/openwrt
        run: |
          set -e
          make download -j8 V=s
          find dl -type f -size -1024c -delete || true

      # 正式编译
      - name: Compile
        working-directory: /workdir/openwrt
        run: |
          set -e
          N=$(nproc)

          # 并行失败后单线程详细重编
          make -j$((N + 1)) || make -j1 V=s

      # 整理固件和配置
      - name: Prepare firmware
        working-directory: /workdir/openwrt
        run: |
          set -e

          FIRMWARE_DIR=$(find bin/targets \
            -mindepth 2 -maxdepth 2 -type d | head -n1)

          test -n "$FIRMWARE_DIR"
          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> "$GITHUB_ENV"

          # 确认固件生成成功
          test -n "$(find "$FIRMWARE_DIR" \
            -maxdepth 1 -type f -name '*.img.gz' -print -quit)"
          test -f "$FIRMWARE_DIR/config.buildinfo"

          # 保存完整配置
          cp .config "$FIRMWARE_DIR/full.config.buildinfo"

          # 保存 H68K 关键配置
          {
            echo "# Hinlink OPC-H68K"
            grep '^CONFIG_TARGET_rockchip=' .config || true
            grep '^CONFIG_TARGET_rockchip_armv8=' .config || true
            grep '^CONFIG_TARGET_MULTI_PROFILE=' .config || true
            grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_' .config || true
            grep '^CONFIG_TARGET_ROOTFS_' .config || true
            grep '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true
            grep '^CONFIG_PACKAGE_luci-app-cpufreq=' .config || true
          } > "$FIRMWARE_DIR/machine.config.buildinfo"

          # 不上传 packages 目录
          rm -rf "$FIRMWARE_DIR/packages"

      # 生成 Release 信息
      - name: Release info
        run: |
          TAG="$(date '+%Y.%m.%d-%H%M%S')-Rockchip-H68K-${GITHUB_RUN_NUMBER}"
          NAME="Rockchip H68K $(date '+%Y-%m-%d %H:%M:%S')"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"

          cat > /tmp/release.md <<EOF
          ## Hinlink OPC-H68K

          - Target: Hinlink OPC-H68K
          - Architecture: Rockchip ARM64
          - LEDE branch: $REPO_BRANCH
          - LEDE commit: $WRT_HASH
          - Build mode: $BUILD_MODE
          - Build time: $BUILD_DATE
          - Run: $GITHUB_RUN_NUMBER
          EOF

      # 创建 Release 并上传固件
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: /tmp/release.md
          files: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/config.buildinfo
            ${{ env.FIRMWARE_DIR }}/machine.config.buildinfo
            ${{ env.FIRMWARE_DIR }}/full.config.buildinfo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 只保留最新 3 个 H68K Release
      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,createdAt,isDraft,isPrerelease \
            --jq '
              .[]
              | select(
                  (.tagName | contains("-Rockchip-H68K-"))
                  and .isDraft == false
                  and .isPrerelease == false
                )
              | [.createdAt,.tagName]
              | @tsv
            ' |
          sort -r |
          tail -n +4 |
          while IFS=$'\t' read -r DATE TAG; do
            [ -z "$TAG" ] && continue
            gh release delete "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          done

      # 编译摘要
      - name: Summary
        run: |
          echo "================================"
          echo "BUILD SUCCESS"
          echo "Target : Hinlink OPC-H68K"
          echo "Mode   : $BUILD_MODE"
          echo "Commit : $WRT_HASH"
          echo "Release: $RELEASE_TAG"
          echo "================================"
