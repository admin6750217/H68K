#
# LEDE Rockchip ARM64 Cloud Build
#
# Source:
# https://github.com/coolsnowwolf/lede
#
# Based on:
# https://github.com/P3TERX/Actions-OpenWrt
#

name: rockchip

permissions: write-all

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # 每周三北京时间 20:00
    # 北京时间 UTC+8
    # GitHub Actions 使用 UTC
    - cron: "0 12 * * 3"

env:
  # ==========================================================
  # 基础设置
  # ==========================================================
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  # LEDE 源码
  # ==========================================================
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  # ==========================================================
  # 编译配置
  # ==========================================================
  PLATFORM_FILE: configs/Target-rockchip-L.txt
  CONFIG_FILE: configs/Packages.txt

  # ==========================================================
  # 自定义脚本
  # ==========================================================
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

  # ==========================================================
  # 上传设置
  # ==========================================================
  # 不上传 Artifact
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false

jobs:
  build:
    name: LEDE Rockchip ARM64
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 检查代码
      # ======================================================
      - name: 检查代码
        uses: actions/checkout@v4

      # ======================================================
      # 2. 初始化环境
      # ======================================================
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "初始化编译环境"
          echo "=========================================="

          chmod +x "$FREE_DISK_SH"
          chmod +x "$ENV_SH"
          chmod +x "$DIY_P1_SH"
          chmod +x "$DIY_P2_SH"

          # 清理磁盘
          "$FREE_DISK_SH"

          # 安装编译依赖
          "$ENV_SH"

          # 清理 GitHub Actions 默认源
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo rm -rf /var/lib/apt/lists/*

          # 设置时区
          sudo timedatectl set-timezone "$TZ"

          # 创建工作目录
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

          # 保存编译时间
          echo "BUILD_DATE=$(date '+%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

          echo
          echo "当前时间："
          date

      # ======================================================
      # 3. 检查磁盘空间
      # ======================================================
      - name: 检查空间使用情况
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 4. 克隆 LEDE
      # ======================================================
      - name: 克隆源码
        working-directory: /workdir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "克隆 LEDE 源码"
          echo "=========================================="

          git clone \
            "$REPO_URL" \
            --depth 1 \
            --single-branch \
            -b "$REPO_BRANCH" \
            openwrt

          # 建立软链接
          ln -sf \
            /workdir/openwrt \
            "$GITHUB_WORKSPACE/openwrt"

          cd /workdir/openwrt

          # 获取源码 Commit
          WRT_HASH=$(git log -1 --pretty=format:'%h')

          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo
          echo "源码：$REPO_URL"
          echo "分支：$REPO_BRANCH"
          echo "Commit：$WRT_HASH"

          # ==================================================
          # GitHub Actions 移除部分国内镜像
          # ==================================================
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE" || true
          fi

      # ======================================================
      # 5. DIY Part 1
      # ======================================================
      - name: 执行 DIY Part 1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "执行 DIY Part 1"
          echo "=========================================="

          chmod +x "$DIY_P1_SH"
          "$DIY_P1_SH"

      # ======================================================
      # 6. 检查 CCACHE
      # ======================================================
      - name: 检查缓存
        id: check-cache
        uses: actions/cache@v4
        with:
          key: rockchip-${{ env.REPO_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            rockchip-${{ env.REPO_BRANCH }}-
          path: |
            ./openwrt/.ccache
            ./openwrt/staging_dir/host*
            ./openwrt/staging_dir/tool*

      # ======================================================
      # 7. 开启 CCACHE
      # ======================================================
      - name: 开启 CCACHE 配置
        shell: bash
        run: |
          set -e

          echo "CONFIG_DEVEL=y" >> openwrt/.config
          echo "CONFIG_CCACHE=y" >> openwrt/.config

      # ======================================================
      # 8. 更新缓存环境
      # ======================================================
      - name: 更新缓存
        shell: bash
        run: |
          set -e

          if [ -d "./openwrt/staging_dir" ]; then

            echo "发现缓存 staging_dir"

            find "./openwrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" |
            while read -r DIR; do
              find "$DIR" \
                -type f \
                -exec touch {} +
            done

            mkdir -p ./openwrt/tmp
            echo "1" > ./openwrt/tmp/.build

            echo "缓存环境恢复完成"

          else

            echo "没有发现 staging_dir"
            echo "首次编译或缓存不存在"

          fi

      # ======================================================
      # 9. 更新 feeds
      # ======================================================
      - name: 更新 feeds
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "更新 feeds"
          echo "=========================================="

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ======================================================
      # 10. 导入配置 + DIY Part 2
      # ======================================================
      - name: 导入配置并执行 DIY Part 2
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "导入编译配置"
          echo "=========================================="

          # --------------------------------------------------
          # 检查 Target 配置
          # --------------------------------------------------
          if [ ! -f "$GITHUB_WORKSPACE/$PLATFORM_FILE" ]; then
            echo "错误：找不到 $PLATFORM_FILE"
            exit 1
          fi

          # --------------------------------------------------
          # 检查 Packages 配置
          # --------------------------------------------------
          if [ ! -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
            echo "错误：找不到 $CONFIG_FILE"
            exit 1
          fi

          # --------------------------------------------------
          # 导入 Target
          # --------------------------------------------------
          echo
          echo "========== Target =========="

          cat "$GITHUB_WORKSPACE/$PLATFORM_FILE"

          cat "$GITHUB_WORKSPACE/$PLATFORM_FILE" \
            >> openwrt/.config

          # --------------------------------------------------
          # 导入 Packages
          # --------------------------------------------------
          echo
          echo "========== Packages =========="

          cat "$GITHUB_WORKSPACE/$CONFIG_FILE"

          cat "$GITHUB_WORKSPACE/$CONFIG_FILE" \
            >> openwrt/.config

          # --------------------------------------------------
          # 复制自定义 files
          # --------------------------------------------------
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            echo
            echo "复制自定义 files"

            rm -rf openwrt/files
            cp -rf "$GITHUB_WORKSPACE/files" openwrt/files
          else
            echo
            echo "没有 files 目录，跳过"
          fi

          # --------------------------------------------------
          # 执行 DIY Part 2
          # --------------------------------------------------
          echo
          echo "=========================================="
          echo "执行 DIY Part 2"
          echo "=========================================="

          chmod +x "$DIY_P2_SH"
          "$DIY_P2_SH"

      # ======================================================
      # 11. 检查最终配置
      # ======================================================
      - name: 检查编译配置
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "检查 Target 配置"
          echo "=========================================="

          grep '^CONFIG_TARGET' .config || true

          echo
          echo "=========================================="
          echo "检查 Packages 配置"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_' .config | head -100 || true

      # ======================================================
      # 12. 下载源码包
      # ======================================================
      - name: 下载文件
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "生成默认配置"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "下载源码包"
          echo "=========================================="

          make download -j8 V=s

          echo
          echo "检查异常文件："

          find dl \
            -type f \
            -size -1024c \
            -exec ls -l {} \;

          find dl \
            -type f \
            -size -1024c \
            -exec rm -f {} \;

      # ======================================================
      # 13. 编译前空间
      # ======================================================
      - name: 编译前空间检查
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 14. 开始编译
      # ======================================================
      - name: 编译固件
        id: compile
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "生成最终配置"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "开始编译 LEDE"
          echo "=========================================="

          THREADS="$(nproc)"

          echo
          echo "CPU 线程：$THREADS"
          echo "LEDE Commit：$WRT_HASH"
          echo

          # --------------------------------------------------
          # 多线程编译
          # --------------------------------------------------
          if ! make -j$((THREADS + 1)); then

            echo
            echo "=========================================="
            echo "多线程编译失败"
            echo "开始单线程详细编译"
            echo "=========================================="
            echo

            make -j1 V=s
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 15. 编译后空间
      # ======================================================
      - name: 编译后空间检查
        if: (!cancelled())
        run: |
          df -hT

      # ======================================================
      # 16. 整理固件
      # ======================================================
      - name: 整理文件
        id: organize
        if: >
          steps.compile.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          cd openwrt/bin/targets/*/*

          echo "=========================================="
          echo "整理固件"
          echo "=========================================="

          # 删除无用文件
          rm -rf *.bin
          rm -rf *.buildinfo
          rm -rf *.json
          rm -rf *.manifest

          # 删除 packages
          rm -rf packages

          # 保存固件目录
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          echo "========== 固件列表 =========="

          ls -lah

      # ======================================================
      # 17. Rockchip 固件重命名
      # ======================================================
      - name: 固件重命名
        if: >
          steps.organize.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          cd "$FIRMWARE"

          shopt -s nullglob

          for file in *rockchip-armv8-*.gz; do

            new_name="${file#rockchip-armv8-}"

            if [ "$file" != "$new_name" ]; then
              echo "重命名："
              echo "  $file"
              echo "  -> $new_name"

              mv -v "$file" "$new_name"
            fi

          done

          echo
          echo "========== 最终固件 =========="

          ls -lah

      # ======================================================
      # 18. 生成 Release 标签
      # ======================================================
      - name: 生成发布标签
        id: tag
        if: >
          steps.compile.outputs.status == 'success'
          && !cancelled()
        shell: bash
        run: |
          set -e

          echo "🎉 LEDE Rockchip ARM64" >> release.txt
          echo "✅ 主线源码" >> release.txt
          echo "🍃 Rockchip 平台" >> release.txt
          echo "❗️ 默认 IP：192.168.8.1" >> release.txt

          RELEASE_TAG="$(date '+%Y.%m.%d_Rockchip')"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"

          echo
          echo "Release Tag：$RELEASE_TAG"

      # ======================================================
      # 19. 上传固件到 GitHub Release
      # ======================================================
      - name: 上传固件到发布
        uses: softprops/action-gh-release@v2
        if: >
          steps.tag.outputs.status == 'success'
          && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: LEDE Rockchip ${{ env.BUILD_DATE }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          overwrite_files: true
