name: rockchip

permissions:
  contents: write

concurrency:
  group: rockchip-h68k
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 选择编译模式
        required: true
        default: 正常编译
        type: choice
        options:
          - 正常编译
          - 仅生成 config.buildinfo

  repository_dispatch:

  schedule:
    - cron: "0 18 * * *"

env:
  TZ: Asia/Shanghai

  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  PLATFORM_FILE: configs/Target-rockchip-L.txt
  PACKAGE_FILE: configs/Packages.txt

  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

jobs:
  build:
    name: 编译 LEDE Rockchip ARM64 H68K
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 检出配置仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 确定编译模式
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_MODE=${{ github.event.inputs.build_mode }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_MODE=正常编译" >> "$GITHUB_ENV"
          fi

      - name: 初始化编译环境
        run: |
          set -e

          sudo mkdir -p /workdir
          sudo chown -R "$(id -u):$(id -g)" /workdir

          chmod +x "$GITHUB_WORKSPACE/$FREE_DISK_SH"
          chmod +x "$GITHUB_WORKSPACE/$ENV_SH"

          bash "$GITHUB_WORKSPACE/$FREE_DISK_SH"
          bash "$GITHUB_WORKSPACE/$ENV_SH"

          find /workdir \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf {} +

          rm -rf "$GITHUB_WORKSPACE/openwrt"
          rm -rf "$GITHUB_WORKSPACE/bin"
          rm -rf "$GITHUB_WORKSPACE/tmp"
          rm -rf "$GITHUB_WORKSPACE/logs"

          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: 下载 LEDE 源码
        run: |
          set -e

          cd /workdir

          git clone \
            "$REPO_URL" \
            --depth 1 \
            --single-branch \
            -b "$REPO_BRANCH" \
            openwrt

          ln -s /workdir/openwrt \
            "$GITHUB_WORKSPACE/openwrt"

          cd /workdir/openwrt

          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> "$GITHUB_ENV"

      - name: 执行自定义脚本一
        working-directory: /workdir/openwrt
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/$DIY_P1_SH"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"

          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

          echo "DIY1 完成"

      - name: 恢复编译缓存
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/tool*
          key: rockchip-${{ env.REPO_BRANCH }}-${{ env.WRT_HASH }}
          restore-keys: |
            rockchip-${{ env.REPO_BRANCH }}-

      - name: 启用编译缓存
        working-directory: /workdir/openwrt
        run: |
          set -e

          sed -i \
            '/^CONFIG_DEVEL=/d;/^CONFIG_CCACHE=/d' \
            .config 2>/dev/null || true

          cat >> .config <<'EOF'
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF

      - name: 更新软件源
        working-directory: /workdir/openwrt
        run: |
          set -e
          ./scripts/feeds update -a

      - name: 安装软件源
        working-directory: /workdir/openwrt
        run: |
          set -e
          ./scripts/feeds install -a

      - name: 导入 H68K 和软件包配置
        working-directory: /workdir/openwrt
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/$PLATFORM_FILE"
          test -f "$GITHUB_WORKSPACE/$PACKAGE_FILE"

          cat "$GITHUB_WORKSPACE/$PLATFORM_FILE" >> .config
          cat "$GITHUB_WORKSPACE/$PACKAGE_FILE" >> .config

      - name: 应用 files
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            cp -a "$GITHUB_WORKSPACE/files/." .
            echo "files/ 应用完成"
          else
            echo "未发现 files/，跳过"
          fi

      - name: 执行自定义脚本二
        working-directory: /workdir/openwrt
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/$DIY_P2_SH"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"

          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

          echo "DIY2 完成"

      - name: 生成并验证最终配置
        working-directory: /workdir/openwrt
        run: |
          set -e

          make defconfig

          echo "验证 Hinlink OPC-H68K"

          COUNT=$(
            grep \
              '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
              .config |
            wc -l
          )

          echo "检测到 Rockchip ARM64 设备数量：$COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Rockchip ARM64 目标设备不是唯一设备"

            grep \
              '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
              .config || true

            exit 1
          fi

          grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h68k=y$' \
            .config

          echo "H68K 目标验证通过"

      - name: 生成 config.buildinfo
        working-directory: /workdir/openwrt
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            .config \
            "$GITHUB_WORKSPACE/output/config.buildinfo"

          cp \
            .config \
            "$GITHUB_WORKSPACE/output/full.config.buildinfo"

          {
            echo "# Hinlink OPC-H68K"
            echo "# Generated: $BUILD_DATE"
            echo "# LEDE commit: $WRT_HASH"
            echo ""

            grep '^CONFIG_TARGET_rockchip=' .config || true
            grep '^CONFIG_TARGET_rockchip_armv8=' .config || true
            grep '^CONFIG_TARGET_MULTI_PROFILE=' .config || true
            grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_' .config || true
            grep '^CONFIG_TARGET_ROOTFS_' .config || true
            grep '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true
            grep '^CONFIG_PACKAGE_luci-app-cpufreq=' .config || true
            grep '^CONFIG_CCACHE=' .config || true
            grep '^CONFIG_DEVEL=' .config || true

          } > "$GITHUB_WORKSPACE/output/machine.config.buildinfo"

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: 发布 config.buildinfo
        if: env.BUILD_MODE == '仅生成 config.buildinfo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: config-H68K-${{ github.run_number }}
          name: H68K config.buildinfo ${{ github.run_number }}
          body: |
            ## Hinlink OPC-H68K

            本版本仅生成最终 config.buildinfo。

            - Target: Hinlink OPC-H68K
            - Architecture: Rockchip ARM64
            - LEDE branch: ${{ env.REPO_BRANCH }}
            - LEDE commit: ${{ env.WRT_HASH }}
            - Build mode: 仅生成 config.buildinfo
            - Build time: ${{ env.BUILD_DATE }}
            - GitHub Run: ${{ github.run_number }}

            配置生成流程：

            LEDE master 默认配置
            +
            Target-rockchip-L.txt
            +
            Packages.txt
            +
            DIY1
            +
            DIY2
            ↓
            make defconfig
            ↓
            最终 .config
            ↓
            config.buildinfo
          files: |
            output/config.buildinfo
            output/full.config.buildinfo
            output/machine.config.buildinfo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置模式完成
        if: env.BUILD_MODE == '仅生成 config.buildinfo'
        run: |
          echo "========================================"
          echo "config.buildinfo 生成完成"
          echo "========================================"
          echo "设备：Hinlink OPC-H68K"
          echo "架构：Rockchip ARM64"
          echo "LEDE：$WRT_HASH"
          echo "模式：$BUILD_MODE"
          echo "========================================"

      - name: 下载编译依赖
        if: env.BUILD_MODE == '正常编译'
        working-directory: /workdir/openwrt
        run: |
          set -e

          make download -j8 V=s

          find dl \
            -type f \
            -size -1024c \
            -delete || true

      - name: 开始正式编译
        if: env.BUILD_MODE == '正常编译'
        working-directory: /workdir/openwrt
        run: |
          set -e

          N=$(nproc)

          echo "CPU 核心数：$N"

          make -j$((N + 1)) || {
            echo "并行编译失败，切换单线程详细编译"
            make -j1 V=s
          }

          echo "编译完成"

      - name: 整理固件和编译配置
        if: env.BUILD_MODE == '正常编译'
        working-directory: /workdir/openwrt
        run: |
          set -e

          FIRMWARE_DIR=$(
            find bin/targets \
              -mindepth 2 \
              -maxdepth 2 \
              -type d |
            head -n1
          )

          test -n "$FIRMWARE_DIR"

          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> "$GITHUB_ENV"

          test -n "$(
            find "$FIRMWARE_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.img.gz' \
              -print \
              -quit
          )"

          test -f "$FIRMWARE_DIR/config.buildinfo"

          cp \
            .config \
            "$FIRMWARE_DIR/full.config.buildinfo"

          cp \
            "$GITHUB_WORKSPACE/output/machine.config.buildinfo" \
            "$FIRMWARE_DIR/machine.config.buildinfo"

          rm -rf "$FIRMWARE_DIR/packages"

          ls -lh "$FIRMWARE_DIR"

      - name: 生成发布信息
        if: env.BUILD_MODE == '正常编译'
        run: |
          set -e

          TAG="$(
            date '+%Y.%m.%d-%H%M%S'
          )-Rockchip-H68K-${GITHUB_RUN_NUMBER}"

          NAME="$(
            echo "Rockchip H68K $(date '+%Y-%m-%d %H:%M:%S')"
          )"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"

          cat > /tmp/release.md <<EOF
          ## Hinlink OPC-H68K

          - Target: Hinlink OPC-H68K
          - Architecture: Rockchip ARM64
          - LEDE branch: $REPO_BRANCH
          - LEDE commit: $WRT_HASH
          - Build mode: $BUILD_MODE
          - Build time: $BUILD_DATE
          - GitHub Run: $GITHUB_RUN_NUMBER

          ### Configuration

          配置由以下内容生成：

          - LEDE master 默认配置
          - Target-rockchip-L.txt
          - Packages.txt
          - DIY1
          - DIY2
          - make defconfig
          EOF

      - name: 发布固件到 GitHub
        if: env.BUILD_MODE == '正常编译'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: /tmp/release.md
          files: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/config.buildinfo
            ${{ env.FIRMWARE_DIR }}/machine.config.buildinfo
            ${{ env.FIRMWARE_DIR }}/full.config.buildinfo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧版本并保留最新三个
        if: env.BUILD_MODE == '正常编译'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,createdAt,isDraft,isPrerelease \
            --jq '
              .[]
              | select(
                  (.tagName | contains("-Rockchip-H68K-"))
                  and .isDraft == false
                  and .isPrerelease == false
                )
              | [.createdAt,.tagName]
              | @tsv
            ' |
          sort -r |
          tail -n +4 |
          while IFS=$'\t' read -r DATE TAG; do

            [ -z "$TAG" ] && continue

            echo "删除旧版本：$TAG"

            gh release delete "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes

          done

          echo "仅保留最新三个 H68K 正式 Release"

      - name: 编译完成摘要
        if: env.BUILD_MODE == '正常编译'
        run: |
          echo "========================================"
          echo "编译成功"
          echo "========================================"
          echo "设备 : Hinlink OPC-H68K"
          echo "架构 : Rockchip ARM64"
          echo "模式 : $BUILD_MODE"
          echo "提交 : $WRT_HASH"
          echo "发布 : $RELEASE_TAG"
          echo "时间 : $BUILD_DATE"
          echo "========================================"
